[project]
name = "spotify-mcp"
version = "0.5.0"
description = "Local Spotify MCP tools for agent-driven album playlists and personal mixes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
 "mcp>=1.26,<2",
 "httpx>=0.28.1,<0.29",
]
[[project.authors]]
name = "Varun Srivastava"
email = "varun.neal@berkeley.edu"

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
]

[tool.uv.sources]
spotify-mcp = { workspace = true }

[project.scripts]
spotify-mcp = "spotify_mcp:main"
spotify-mix = "spotify_mcp.recommend:main"
